# =============================================================================
# config.yaml — Evaluasi Lokalisasi Grad-CAM pada Klasifikasi Pneumonia
#               (EfficientNet-B0, Fusi Multi-Channel Berbasis Segmentasi Paru)
#
# `locked:`  = nilai yang DITETAPKAN PROPOSAL. Dilarang diubah tanpa mengubah
#              proposal. Setiap butir memuat `value` dan `ref` (rujukan).
#              tests/test_proposal_conformity.py membandingkan SEMUA nilai di sini
#              dengan konstanta independen di test; gagal bila ada yang beda.
# `assumed:` = default yang DIPILIH PENULIS KODE karena proposal ambigu
#              (lihat docs/AMBIGUITIES.md; id AMBIG-n). Bukan nilai proposal.
# `runtime:` = path, jumlah worker, DEBUG, flag Colab (bukan bagian desain eksperimen).
#
# Sumber kebenaran = file .tex terbaru (Pendahuluan.tex, Kajian-Pustaka.tex, Metodologi.tex).
# =============================================================================

locked:

  data:
    sources:                   {value: [kermany, rsna], ref: "Pendahuluan.tex L7, L53; Metodologi.tex §3.2.1"}
    kermany_raw_total:         {value: 5856, ref: "Metodologi.tex §3.2.1; Kajian-Pustaka.tex Tabel 2.2"}
    kermany_clean_total:       {value: 5827, ref: "Metodologi.tex §3.2.1 (pascadeduplikasi 29 duplikat)"}
    kermany_balanced_total:    {value: 3164, ref: "Metodologi.tex §3.2.1, Tabel 3.1 (1.582 N + 1.582 P)"}
    rsna_raw_total:            {value: 26684, ref: "Metodologi.tex §3.2.1; Kajian-Pustaka.tex Tabel 2.2"}
    rsna_excluded_not_normal:  {value: 11821, ref: "Metodologi.tex §3.2.1 (No Lung Opacity/Not Normal dibuang)"}
    rsna_clean_binary_total:   {value: 14863, ref: "Metodologi.tex §3.2.1 (8.851 N + 6.012 Lung Opacity)"}
    rsna_balanced_total:       {value: 12024, ref: "Metodologi.tex §3.2.1, Tabel 3.1 (6.012 N + 6.012 P)"}
    total_images:              {value: 15188, ref: "Metodologi.tex §3.2.1, Tabel 3.1 (gabungan seimbang 1:1 per sumber)"}
    n_normal:                  {value: 7594, ref: "Metodologi.tex §3.2.1, Tabel 3.1 (1.582 Kermany + 6.012 RSNA)"}
    n_pneumonia:               {value: 7594, ref: "Metodologi.tex §3.2.1, Tabel 3.1 (1.582 Kermany + 6.012 RSNA)"}
    builtin_test_images:       {value: 624,  ref: "Metodologi.tex §3.2.1 (624 citra uji bawaan Kermany digabung ulang)"}
    source_class_ratio_target: {value: 1.0,  ref: "Metodologi.tex §3.2.1 (rasio kelas 1:1 pada masing-masing sumber)"}
    phash_max_hamming:         {value: 5,    ref: "Metodologi.tex §3.2.1 (deduplikasi perseptual Hamming <= 5)"}
    harmonized_format:         {value: png_8bit_lossless, ref: "Metodologi.tex §3.2.1 (PNG grayscale 8-bit lossless)"}
    split_ratio_train:         {value: 0.70, ref: "Metodologi.tex §3.2.1, Tabel 3.1"}
    split_ratio_val:           {value: 0.15, ref: "Metodologi.tex §3.2.1, Tabel 3.1"}
    split_ratio_test:          {value: 0.15, ref: "Metodologi.tex §3.2.1, Tabel 3.1"}
    # Tabel 3.1 = target alokasi gabungan seimbang 1:1 per sumber (pra-dedup perseptual lintas sumber)
    table31_train:             {value: {normal: 5315, pneumonia: 5315, total: 10630}, ref: "Metodologi.tex Tabel 3.1"}
    table31_val:               {value: {normal: 1139, pneumonia: 1139, total: 2278},  ref: "Metodologi.tex Tabel 3.1"}
    table31_test:              {value: {normal: 1140, pneumonia: 1140, total: 2280},  ref: "Metodologi.tex Tabel 3.1"}
    grayscale_channels:        {value: 1,    ref: "Metodologi.tex §3.2.1-3.2.2"}
    intensity_range:           {value: [0.0, 1.0], ref: "docs/1.md D5 (skala [0,1] sebelum normalisasi)"}

  lung_mask:
    unet_frozen:               {value: true, ref: "Pendahuluan.tex L57; Metodologi.tex §3.2.2"}
    binarize_threshold:        {value: 0.5,  ref: "Metodologi.tex §3.2.2"}
    keep_largest_components:   {value: 2,    ref: "Metodologi.tex §3.2.2"}
    hole_filling:              {value: true, ref: "Metodologi.tex §3.2.2"}
    qc_dsc_min:                {value: 0.85, ref: "Metodologi.tex §3.2.2"}
    qc_iou_min:                {value: 0.75, ref: "Metodologi.tex §3.2.2"}
    qc_per_class:              {value: true, ref: "Metodologi.tex §3.2.2"}
    qc_rsua_total:             {value: 85,   ref: "Metodologi.tex §3.2.2"}
    qc_rsua_pneumonia:         {value: 53,   ref: "Metodologi.tex §3.2.2"}
    qc_rsua_normal:            {value: 32,   ref: "Metodologi.tex §3.2.2"}
    rsua_covid_excluded:       {value: 207,  ref: "Kajian-Pustaka.tex Tabel 2.2; docs/1.md L3"}
    rsua_mask_size:            {value: [256, 256], ref: "Kajian-Pustaka.tex Tabel 2.2"}
    qc_kermany_total:          {value: 50,   ref: "Metodologi.tex §3.2.2"}
    qc_kermany_normal:         {value: 25,   ref: "Metodologi.tex §3.2.2"}
    qc_kermany_pneumonia:      {value: 25,   ref: "Metodologi.tex §3.2.2"}
    r_paru_extreme_threshold:  {value: 0.05, ref: "Metodologi.tex §3.2.2"}
    r_paru_class_diff_threshold: {value: 0.05, ref: "Metodologi.tex §3.2.2"}
    lr_balance_min_ratio:      {value: 0.30, ref: "Metodologi.tex §3.2.2 (rasio keseimbangan paru kiri-kanan r_LR)"}

  preprocess:
    image_size:        {value: 224, ref: "Metodologi.tex §3.2.2"}
    mask_interp:       {value: nearest, ref: "Metodologi.tex §3.2.2"}
    imagenet_mean:     {value: [0.485, 0.456, 0.406], ref: "Metodologi.tex §3.2.2 (statistik ImageNet standar, Deng2009)"}
    imagenet_std:      {value: [0.229, 0.224, 0.225], ref: "Metodologi.tex §3.2.2 (statistik ImageNet standar, Deng2009)"}
    mask_channel_normalized: {value: false, ref: "Metodologi.tex §3.3"}
    hardmask_before_normalization: {value: true, ref: "Metodologi.tex §3.2.2, §3.3"}

  augmentation:       # hanya D_train
    rotation_deg:     {value: 15,  ref: "Metodologi.tex §3.2.2"}
    hflip_p:          {value: 0.5, ref: "Metodologi.tex §3.2.2"}
    translate_frac:   {value: 0.10, ref: "Metodologi.tex §3.2.2"}
    zoom_range:       {value: [0.9, 1.1], ref: "Metodologi.tex §3.2.2"}
    fill_value:       {value: 0, ref: "Metodologi.tex §3.2.2"}
    image_interp:     {value: bilinear, ref: "Metodologi.tex §3.2.2"}
    mask_interp:      {value: nearest,  ref: "Metodologi.tex §3.2.2"}
    identical_params_for_pair: {value: true, ref: "Metodologi.tex §3.2.2"}
    val_test_augmentation: {value: false, ref: "Metodologi.tex §3.2.2"}

  model:
    architecture:      {value: efficientnet_b0, ref: "Metodologi.tex §3.3"}
    pretrained:        {value: imagenet, ref: "Metodologi.tex §3.3"}
    full_finetuning:   {value: true, ref: "Metodologi.tex §3.4"}
    stem_conv_3ch:     {value: [32, 3, 3, 3], ref: "Metodologi.tex §3.3"}
    stem_conv_4ch:     {value: [32, 4, 3, 3], ref: "Metodologi.tex §3.3"}
    stem_ch4_init:     {value: mean_of_rgb_pretrained, ref: "Metodologi.tex Pers. 3.2"}
    head_feature_map:  {value: [1280, 7, 7], ref: "Metodologi.tex §3.3"}
    dropout:           {value: 0.2, ref: "Metodologi.tex §3.3, Tabel 3.2"}
    n_logits:          {value: 1, ref: "Metodologi.tex §3.3"}
    decision_threshold: {value: 0.5, ref: "Metodologi.tex §3.3"}
    positive_class:    {value: pneumonia, ref: "Metodologi.tex §3.5.2"}

  train:
    loss:              {value: bce_unweighted, ref: "Metodologi.tex §3.4"}
    cam_penalty:       {value: false, ref: "Metodologi.tex §3.4"}
    optimizer:         {value: adamw, ref: "Metodologi.tex §3.4"}
    lr:                {value: 1.0e-4, ref: "Metodologi.tex §3.4, Tabel 3.2"}
    weight_decay:      {value: 1.0e-4, ref: "Metodologi.tex Tabel 3.2"}
    lr_scheduler:      {value: none, ref: "Metodologi.tex §3.4 ('laju belajar tetap')"}
    batch_size:        {value: 32, ref: "Metodologi.tex Tabel 3.2"}
    max_epochs:        {value: 50, ref: "Metodologi.tex Tabel 3.2"}
    early_stopping_patience: {value: 10, ref: "Metodologi.tex Tabel 3.2"}
    early_stopping_monitor:  {value: val_loss, ref: "Metodologi.tex Tabel 3.2"}
    keep_best_val_loss_weights: {value: true, ref: "Metodologi.tex Algoritma 3.1"}
    seeds:             {value: [42, 100, 2024, 2025, 2026], ref: "Metodologi.tex §3.4"}
    configs:           {value: [baseline_3ch, hardmask_3ch, fusion_4ch], ref: "Metodologi.tex §3.1"}
    n_runs:            {value: 15, ref: "3 konfigurasi x 5 seed"}
    deterministic:     {value: true, ref: "Metodologi.tex §3.4"}
    precision:         {value: fp32, ref: "docs/1.md M3 (AMP default off)"}
    split_fixed_across_seeds: {value: true, ref: "Metodologi.tex §3.2.1"}

  xai:
    method:            {value: gradcam, ref: "Metodologi.tex Algoritma 3.1"}
    target_class:      {value: predicted_class, ref: "Pendahuluan.tex Batasan 2; Kajian-Pustaka.tex §2.6.2"}
    target_score_pos:  {value: "+z", ref: "Kajian-Pustaka.tex §2.6.2"}
    target_score_neg:  {value: "-z", ref: "Kajian-Pustaka.tex §2.6.2"}
    on_split:          {value: test_no_augmentation, ref: "Metodologi.tex Algoritma 3.1; Gambar 3.1 panah merah"}
    upsample:          {value: bilinear, ref: "Kajian-Pustaka.tex §2.6.2"}
    normalize:         {value: minmax_0_1, ref: "Kajian-Pustaka.tex §2.6.2"}
    acr_epsilon:       {value: 1.0e-6, ref: "Kajian-Pustaka.tex Pers. 2.4"}
    iou_top_fraction:  {value: 0.30, ref: "Kajian-Pustaka.tex Pers. 2.6"}
    heatmap_size:      {value: [224, 224], ref: "Metodologi.tex §3.5.2"}

  metrics:
    primary_classification:    {value: [auc_roc, f1], ref: "Metodologi.tex §3.5.2"}
    supporting_classification: {value: [accuracy, precision, recall, specificity, balanced_accuracy], ref: "Metodologi.tex §3.5.2"}
    localization_primary:      {value: acr, ref: "Metodologi.tex §3.5.2"}
    localization_complement:   {value: iou_paru, ref: "Metodologi.tex §3.5.2"}
    localization_normalized:   {value: acr_norm, ref: "Metodologi.tex §3.2.2, §3.5.2"}

  stats:
    unit_of_analysis:          {value: patient, ref: "Metodologi.tex §3.5.2"}
    bootstrap_B:               {value: 1000, ref: "Metodologi.tex §3.5.2"}
    bootstrap_ci_level:        {value: 0.95, ref: "Metodologi.tex §3.5.2"}
    bootstrap_ci_method:       {value: percentile, ref: "docs/1.md S4 (CI persentil)"}
    bootstrap_resample_level:  {value: patient, ref: "Metodologi.tex §3.5.2"}
    wilcoxon_alternative:      {value: two-sided, ref: "Metodologi.tex §3.5.2"}
    multiple_testing:          {value: holm_bonferroni, ref: "Metodologi.tex §3.5.2"}
    alpha:                     {value: 0.05, ref: "Metodologi.tex §3.5.2"}
    holm_family_h1:            {value: [auc_roc, f1], ref: "Metodologi.tex §3.5.2"}
    holm_family_h2:            {value: [acr, iou_paru], ref: "Metodologi.tex §3.5.2"}
    stability_sigma_auc_max:   {value: 0.010, ref: "Metodologi.tex §3.5.1"}
    stability_no_nan_loss:     {value: true, ref: "Metodologi.tex §3.5.1"}
    min_group_n_per_seed:      {value: 5, ref: "Metodologi.tex §3.5.1"}
    h1_noninferiority_margin:  {value: -0.010, ref: "Pendahuluan.tex Hipotesis 1; Metodologi.tex §3.5.2"}
    h1_vs_hardmask_lower_ci:   {value: 0.0, ref: "Metodologi.tex §3.5.2"}
    h2_delta_acr_min:          {value: 0.020, ref: "Pendahuluan.tex Hipotesis 2; Metodologi.tex §3.5.2"}
    h2_delta_iou_min:          {value: 0.010, ref: "Pendahuluan.tex Hipotesis 2; Metodologi.tex §3.5.2"}
    h2_lower_ci:               {value: 0.0, ref: "Metodologi.tex §3.5.2"}

# -----------------------------------------------------------------------------
assumed:   # default penulis-kode untuk ambiguitas; catat di docs/AMBIGUITIES.md
  split_seed:                  {value: 42, ambig: AMBIG-3}
  subsample_seed:              {value: 42, ambig: AMBIG-3}
  image_interp_resize:         {value: bilinear, ambig: AMBIG-4}
  unet_prob_resize_before_thr: {value: true, ambig: AMBIG-1}
  dedup_hashes:                {value: [sha256_bytes, sha256_pixels, phash_64], ambig: AMBIG-2}
  gradcam_target_layer:        {value: conv_head, ambig: AMBIG-5}    # alternatif: bn2, act2
  iou_top_quantile:            {value: 0.70, ambig: AMBIG-7}
  r_paru_source:               {value: m224, ambig: AMBIG-14}
  cache_dtype:                 {value: float32, ambig: AMBIG-17}
  qc_kermany_selection_seed:   {value: 42, ambig: "L3(2) seed tetap"}
  patient_id_regex:
    value: '^(?P<cls>NORMAL|BACTERIA|VIRUS)-(?P<pid>\d+)-(?P<seq>\d+)\.jpeg$'
    ambig: DEV-1

# -----------------------------------------------------------------------------
runtime:
  project_root_colab:   /content/drive/MyDrive/LAB_TA_GradCAM_Pneumonia
  project_root_env:     PROJECT_ROOT          # variabel lingkungan (lokal)
  project_root_local_default: ./local_mirror
  work_dir_colab:       /content/work         # salinan data ke disk lokal Colab
  rel_paths:
    kermany_raw:        data/raw/kermany/chest_xray
    rsna_raw:           data/raw/rsna
    rsua_validated:     "data/raw/rsua/Data Chest X-Ray RSUA (Validated)-20230618T025557Z-001/Data Chest X-Ray RSUA (Validated)"
    rsua_class_dirs:    {Pneumonia: Non_Covid_Pneumonia, Normal: Non_Covid, Excluded_Covid: Covid}
    kermany_manual_masks: data/raw/kermany_manual_masks
    seg_public:         data/raw/seg_public
    interim:            data/interim
    harmonized_png:     data/interim/harmonized_png
    processed:          data/processed
    unet_weights_dir:   models/unet_frozen
    outputs:            outputs
  DEBUG:                false
  debug_subset_per_class: 64
  debug_epochs:         2
  debug_seeds:          [42]
  num_workers:          2
  ACKNOWLEDGE_QC_FAIL:  false
  save_overlay_samples: true
  code_source:          drive            # drive | git (git clone private via Colab Secrets)
